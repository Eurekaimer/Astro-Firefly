name: Update Bangumi Subscription

on:
  schedule:
    # 每天 UTC 16:20（北京时间次日 00:20）
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bangumi-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update Bangumi manga subscription snapshot
        env:
          BANGUMI_USER_ID: ${{ secrets.BANGUMI_USER_ID || vars.BANGUMI_USER_ID }}
        run: |
          node scripts/update-bangumi-subscription.mjs

      - name: Commit subscription snapshot
        run: |
          if git diff --quiet -- src/data/bangumi-manga-progress.json; then
            echo "Bangumi subscription snapshot is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/bangumi-manga-progress.json
          git commit -m "chore: update bangumi manga subscription"
          git push
